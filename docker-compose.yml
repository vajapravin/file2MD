services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: file2md-backend
    ports:
      - "${BACKEND_PORT:-8086}:8086"
    environment:
      - APP_ENV=development
      - APP_DEBUG=true
      - HOST=0.0.0.0
      - PORT=8086
      - MAX_UPLOAD_SIZE_MB=60
      - REDIS_URL=redis://redis:6379/0
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:8086,https://file2md.vajapravin.me,http://file2md.vajapravin.me
    command: [ "uvicorn", "file2md.main:app", "--host", "0.0.0.0", "--port", "8086", "--reload" ]
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/tests:/app/tests:ro
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8086/api/v1/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-net

  redis:
    image: redis:7-alpine
    container_name: file2md-redis
    ports:
      - "${REDIS_PORT:-6389}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - app-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: file2md-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - BACKEND_URL=http://backend:8086
      - VITE_API_BASE_URL=
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
