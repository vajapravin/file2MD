services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: file2md-backend
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    environment:
      - APP_ENV=development
      - APP_DEBUG=true
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:8001
    command: ["uvicorn", "file2md.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend/src:/app/src:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: file2md-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - BACKEND_URL=http://backend:8000
      - VITE_API_BASE_URL=http://localhost:8001
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: file2md-network
